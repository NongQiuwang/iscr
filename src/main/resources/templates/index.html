<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>乌拉源农业</title>
<!--    <link rel="icon" type="image/png" href="logo.jpg">-->
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 背景动画 */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* 玻璃态卡片 */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 1s ease forwards;
        }

        /* 卡片动画 */
        @keyframes fadeUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 标题样式 */
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #e6e6e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            border-radius: 2px;
        }

        /* 副标题 */
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        /* 描述文本 */
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            color: rgba(255, 255, 255, 0.85);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 按钮样式 */
        .btn-container {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
            z-index: -1;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* 特性部分 */
        .features {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 2rem;
            width: 100%;
        }

        .feature {
            flex: 1;
            min-width: 250px;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: all 0.3s ease;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.5s;
        }

        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .feature-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .feature-text {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        /* 动画延迟 */
        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .feature:nth-child(2) {
            animation-delay: 0.7s;
        }

        .feature:nth-child(3) {
            animation-delay: 0.9s;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .description {
                font-size: 1rem;
            }

            .card {
                padding: 2rem 1.5rem;
            }
        }

        /* 装饰元素 */
        .decoration {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            z-index: -1;
        }

        .decoration-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite;
        }

        .decoration-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            animation: float 12s ease-in-out infinite reverse;
        }

        .decoration-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>
<body>
<!-- 装饰元素 -->
<div class="decoration decoration-1"></div>
<div class="decoration decoration-2"></div>
<div class="decoration decoration-3"></div>

<div class="container">
    <div class="card">
        <h1 class="title">欢迎来到我们的网站</h1>
        <p class="subtitle">探索无限可能，创造精彩未来</p>
        <p class="description">
            我们致力于提供最优质的服务和创新的解决方案，帮助您实现目标，超越期望。
            加入我们，开启一段精彩的旅程。
        </p>
        <div class="btn-container">
            <button class="btn btn-primary">开始探索</button>
            <button class="btn btn-secondary">了解更多</button>
        </div>
    </div>

    <div class="features">
        <div class="feature">
            <span class="feature-icon">🚀</span>
            <h3 class="feature-title">创新技术</h3>
            <p class="feature-text">采用最新技术，提供前沿解决方案，确保您始终处于行业领先地位。</p>
        </div>
        <div class="feature">
            <span class="feature-icon">💡</span>
            <h3 class="feature-title">专业团队</h3>
            <p class="feature-text">我们拥有经验丰富的专业团队，为您提供最优质的服务和支持。</p>
        </div>
        <div class="feature">
            <span class="feature-icon">🌟</span>
            <h3 class="feature-title">卓越体验</h3>
            <p class="feature-text">注重每一个细节，为您打造无缝、愉悦的用户体验。</p>
        </div>
    </div>
</div>

<script>
    // 添加一些交互效果
    document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.btn');

        buttons.forEach(button => {
            button.addEventListener('click', function() {
                // 添加点击反馈
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);

                // 根据按钮文本执行不同操作
                if (this.textContent === '开始探索') {
                    alert('欢迎开始探索我们的网站！');
                } else if (this.textContent === '了解更多') {
                    alert('感谢您对我们的关注！');
                }
            });
        });

        // 添加滚动动画
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // 观察所有特性卡片
        document.querySelectorAll('.feature').forEach(card => {
            observer.observe(card);
        });
    });
</script>
</body>
</html>
