<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('404')"/>
    <link th:href="@{/css/pear/error.css}" rel="stylesheet"/>
    <link th:href="@{/lib/button/button.css}" rel="stylesheet"/>
    <style>
        .pear-btn-primary {
            background-color: #36b368!important;
        }
    </style>
</head>
<body>
<div class="content">
    <img th:src="@{/images/404.svg}" alt="">
    <div class="content-r">
        <h1>404</h1>
        <p>抱歉，你访问的页面不存在或仍在开发中</p>
        <button class="pear-btn pear-btn-primary" id="closeBtn404">返回首页</button>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script type="text/javascript" th:src="@{/js/config.js}"></script>
<script>
    $("#closeBtn404").click(function(){
        var index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);//关闭当前页
    });
</script>
</body>
</html>
